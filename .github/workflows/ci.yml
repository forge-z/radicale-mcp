name: Test and publish MCP image

on:
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/forge-z/radicale-mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install .
      - name: Validate Compose example
        env:
          DAV_USERNAME: test-user
          DAV_PASSWORD: test-password
          MCP_TOKEN: test-token
        run: docker compose config --quiet
      - name: Build MCP image
        id: build
        run: |
          docker build --pull --no-cache --tag "$IMAGE:$GITHUB_SHA" --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" --label "org.opencontainers.image.revision=$GITHUB_SHA" .
          echo "image_id=$(docker image inspect --format '{{.Id}}' "$IMAGE:$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
      - name: Test the built image against a separate Radicale
        env:
          RADICALE_MCP_TEST_IMAGE: ghcr.io/forge-z/radicale-mcp:${{ github.sha }}
        run: python -m unittest discover -s tests -v
      - name: Publish the tested image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TESTED_IMAGE_ID: ${{ steps.build.outputs.image_id }}
        run: |
          test "$(docker image inspect --format '{{.Id}}' "$IMAGE:$GITHUB_SHA")" = "$TESTED_IMAGE_ID"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$GITHUB_SHA"
          docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:latest"
          docker push "$IMAGE:latest"
          {
            echo "Commit: $GITHUB_SHA"
            echo "Tested image: $TESTED_IMAGE_ID"
            docker image inspect --format 'Published digest: {{index .RepoDigests 0}}' "$IMAGE:$GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Log out of the registry
        if: always()
        run: docker logout ghcr.io
