name: radicale

services:
  radicale:
    image: ghcr.io/kozea/radicale:stable
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
    ports:
      - "5232:5232"
    volumes:
      - config:/etc/radicale
      - data:/var/lib/radicale

  radicale-mcp:
    image: ghcr.io/forge-z/radicale-mcp:latest
    restart: unless-stopped
    init: true
    depends_on:
      - radicale
    environment:
      DAV_URL: http://radicale:5232/
      DAV_USERNAME: ${DAV_USERNAME:?Set DAV_USERNAME}
      DAV_PASSWORD: ${DAV_PASSWORD:?Set DAV_PASSWORD}
      MCP_TOKEN: ${MCP_TOKEN:?Set MCP_TOKEN}
      MCP_TIMEZONE: ${MCP_TIMEZONE:-America/Sao_Paulo}
      PORT: "8080"
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:' + __import__('os').environ.get('PORT', '8080') + '/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3

volumes:
  config:
    name: radicale-config
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./config
  data:
    name: radicale-data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data
